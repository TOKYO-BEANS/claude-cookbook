# The `AI review` Depot CI workflow: an advisory Claude review of a pull request
# from a branch of the same repository. Read README.md in this folder first.
# The Stack Atlas standard writes this file to .depot/workflows/ai-review.yml and
# review.mjs, package.json and package-lock.json to .depot/ai-review/. Change
# them in Stack Atlas, never by hand.
#
# - One review of the commit that is about to merge, not one per push (owner,
#   16 November 2026: "Opus 5.5, once per PR"; a review per push used the
#   plan's USD 200 of monthly API credit in 12 days). The workflow runs only
#   when a pull request is marked ready for review; a push runs nothing. So a
#   review is asked for by marking the pull request ready (a draft), or by
#   making it a draft and ready again: `gh pr ready <n> --undo`, then
#   `gh pr ready <n>`. The merge commands do that themselves when the head
#   has no review (Stack Atlas scripts/workflows.mjs review-request), never
#   for a draft: its author asks by marking it ready. The check
#   `AI review / ai-review` is then on the head commit, and the merge gate
#   reads the comment against it.
# - A second request while a review runs cancels the first (concurrency below):
#   one pull request has one review at a time.
# - The job runs the BASE branch's copy of .depot/ai-review/, written to
#   $RUNNER_TEMP/ai-review, never the pull request's copy: a pull request
#   cannot change the reviewer that holds the plan token. A base branch without a
#   reviewer yet (the pull request that first adds it) reports "review
#   unavailable: no reviewer on the base branch" and runs nothing.
# - Pull requests from forks skip the job (the `if:` below), and review.mjs
#   checks again before it reads the secret. Depot CI does not run fork pull
#   requests yet either; when it does, they get no secrets.
# - The job never blocks a merge: review.mjs always exits 0 and the job is
#   not a required check. A failed call posts "review unavailable".
# - Needs the Depot CI secret CLAUDE_CODE_OAUTH_TOKEN_REVIEW (a `claude
#   setup-token` token of the owner's Claude subscription, which can only make
#   model requests; owner, question dialog of 17 November 2026: "Token in
#   Depot CI (Recommended)"), organisation-wide in Depot org bn9mw0t770; never
#   paste a token into chat or a file. review.mjs runs one `claude -p` with no
#   tools on the plan. Without the secret the job posts "review unavailable"
#   for a missing secret, and no fallback review stands in for that.
name: AI review
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-24.04
    # One run of at most 20 minutes after installing Claude Code (about 371 MB),
    # plus checkout and install.
    timeout-minutes: 30
    # Depot CI's GITHUB_TOKEN is a Depot Code Access app token; the app holds
    # pull_requests: write, so this job can post its one comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history: the base commit (for the reviewer and the rules) and
          # the merge base (for the diff) are both in the checkout.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Copy the reviewer from the base branch
        id: reviewer
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          reason=""
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            reason="the base commit id is missing"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            reason="the base commit is not in the checkout"
          else
            for f in review.mjs package.json package-lock.json; do
              git cat-file -e "${BASE_SHA}:.depot/ai-review/$f" 2>/dev/null || reason="no reviewer on the base branch"
            done
          fi
          if [ -n "$reason" ]; then
            echo "review unavailable: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ai-review"
          for f in review.mjs package.json package-lock.json; do
            git show "${BASE_SHA}:.depot/ai-review/$f" > "$RUNNER_TEMP/ai-review/$f"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Install Aikido Safe Chain (malware check on npm and pip installs)
        if: steps.reviewer.outputs.ready == 'true'
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          # Outside the checkout: the installer sources nvm, and nvm stops it (exit 3)
          # on a .nvmrc naming a Node version that nvm does not hold.
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
          # Minimum package age 24 hours, as the standard's Safe Chain step sets it
          # (owner, 18 November 2026; never lower), for the next step's npm ci.
          echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=24" >> "$GITHUB_ENV"
      - name: Install the reviewer's locked dependencies
        if: steps.reviewer.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ai-review"
          npm ci --ignore-scripts
      # node, never npx or npm exec: Safe Chain checks every npx call against the
      # registry (10 s limit, fails closed) even for an installed package. Runs
      # from the checkout's root, where review.mjs reads the diff with git.
      - name: AI review (advisory)
        if: steps.reviewer.outputs.ready == 'true'
        env:
          # The Claude plan token (claude setup-token): the review runs on the plan.
          CLAUDE_CODE_OAUTH_TOKEN_REVIEW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_REVIEW }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed through env, never interpolated into the script: the title and
          # body are the pull request author's text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node "$RUNNER_TEMP/ai-review/review.mjs"
