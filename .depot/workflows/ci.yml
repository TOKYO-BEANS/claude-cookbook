name: Depot CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Diff-aware scans on pull requests fetch the base branch with this
          # read-only token (permissions: contents: read).
          persist-credentials: true
          fetch-depth: 0
      # The standard's Safe Chain step (safe-chain-step.yml in Stack Atlas's
      # templates/depot-security), unchanged: one release and one checksum in
      # every job of the workflow.
      - name: Install Aikido Safe Chain (malware check on npm and pip installs)
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          # Outside the checkout: the installer sources nvm, and nvm stops it (exit 3)
          # on a .nvmrc naming a Node version that nvm does not hold.
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
          # Minimum package age 24 hours, not Safe Chain's 48-hour default (owner,
          # 18 November 2026; never lower). The hold covers the hours before a new
          # malicious release reaches Aikido's malware feed. $GITHUB_ENV carries it to
          # the job's later steps, where the installs run (a step's own env: would
          # not), and it outranks the hours a repository's .aikido sets.
          echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=24" >> "$GITHUB_ENV"
      # Version and wheel hashes live in .depot/semgrep-requirements.txt; pip installs
      # only those wheels and refuses any file whose hash does not match.
      - name: Install Semgrep
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep"
          # Through Safe Chain. A venv's own python, called by path, goes around
          # Safe Chain's wrappers: so the venv comes first on PATH and safe-chain
          # starts its python by name. Without Safe Chain this line fails; it
          # never installs unchecked. Do not change it back to a path.
          PATH="$RUNNER_TEMP/semgrep/bin:$PATH" env -u PKG_EXECPATH safe-chain python -m pip install --require-hashes --no-deps --only-binary :all: -r .depot/semgrep-requirements.txt
          # The lock overrides Semgrep's mcp and OpenTelemetry pins (GHSA-84m7-p3x7-pcfv,
          # GHSA-xcq7-p3pf-p88h and GHSA-mf5v-w3w3-f6cg; see the lock's header): pip check
          # may report exactly these four conflicts, in any order, and nothing else.
          accepted=(
            "semgrep 1.182.0 has requirement mcp==1.29.0, but you have mcp 1.30.0."
            "semgrep 1.182.0 has requirement opentelemetry-api~=1.37.0, but you have opentelemetry-api 1.45.2."
            "semgrep 1.182.0 has requirement opentelemetry-exporter-otlp-proto-http~=1.37.0, but you have opentelemetry-exporter-otlp-proto-http 1.45.2."
            "semgrep 1.182.0 has requirement opentelemetry-sdk~=1.37.0, but you have opentelemetry-sdk 1.45.2."
          )
          broken="$("$RUNNER_TEMP/semgrep/bin/python" -m pip check)" || [ "$(sort <<<"$broken")" = "$(printf '%s\n' "${accepted[@]}" | sort)" ] || { echo "$broken"; exit 1; }
          echo "pip check: $broken"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: Semgrep (Supply Chain)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "::error::Depot CI secret SEMGREP_APP_TOKEN is not set"
            exit 1
          fi
          semgrep ci --supply-chain --no-suppress-errors --json-output="$RUNNER_TEMP/semgrep.json"
      # Our own gate, versioned here instead of in the Semgrep account policy: fail on
      # a vulnerable dependency of high or critical severity unless Semgrep classes
      # it unreachable, and on any dependency it classes malicious. The classes are
      # Semgrep's own (exposure_type in its cli/src/semgrep/rule_match.py): an
      # "upgrade-only" or "malicious" rule is reachable whatever sca_info.reachable
      # says ("vulnerable even without usage"); a "legacy" rule does not look for
      # reachability, so it is undetermined and blocks like a reachable one; any
      # other rule is what that field says, and a field that is neither true nor
      # false is undetermined. A result it cannot read (sca_info or metadata of
      # another shape) fails it at any severity. Until 17 November 2026 the gate
      # read only the field. A code finding is CodeQL's to gate. Prints rule and
      # location only, never code.
      - name: Gate on reachable vulnerable dependencies
        run: |
          python3 - "$RUNNER_TEMP/semgrep.json" <<'PY'
          import json, os, sys
          if not os.path.exists(sys.argv[1]):
              print("Semgrep gate: no results file - the scan did not complete")
              sys.exit(1)
          data = json.load(open(sys.argv[1]))
          high = {"ERROR", "HIGH", "CRITICAL"}
          def exposure(extra, sca):
              meta = extra.get("metadata")
              if not isinstance(sca, dict) or not isinstance(meta, (dict, type(None))):
                  return "unreadable"
              kind = (meta or {}).get("sca-kind")
              if kind in ("upgrade-only", "malicious"):
                  return kind
              if kind == "legacy":
                  return "undetermined"
              reachable = sca.get("reachable")
              return "reachable" if reachable is True else "unreachable" if reachable is False else "undetermined"
          blocking, passed = [], []
          for r in data.get("results", []):
              if not isinstance(r, dict) or not isinstance(r.get("extra") or {}, dict):
                  blocking.append(f"a result the gate cannot read [{type(r).__name__}/unreadable]")
                  continue
              extra = r.get("extra") or {}
              severity = str(extra.get("severity", "")).upper()
              sca = extra.get("sca_info")
              if sca is None:
                  continue
              kind = exposure(extra, sca)
              where = f"{r.get('check_id')} {r.get('path')}:{(r.get('start') or {}).get('line')} [{severity}/{kind}]"
              if kind in ("malicious", "unreadable") or (severity in high and kind != "unreachable"):
                  blocking.append(where)
              elif severity in high:
                  passed.append(where)
          total = len(data.get("results", []))
          print(f"Semgrep gate: {total} findings, {len(blocking)} blocking (a high or critical dependency unless Semgrep classes it unreachable; any malicious one)")
          for b in blocking:
              print("  BLOCKING " + b)
          for p in passed:
              print("  not blocking " + p)
          sys.exit(1 if blocking else 0)
          PY

  test:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install Aikido Safe Chain (malware check on npm and pip installs)
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          # Outside the checkout: the installer sources nvm, and nvm stops it (exit 3)
          # on a .nvmrc naming a Node version that nvm does not hold.
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
          # Minimum package age 24 hours, not Safe Chain's 48-hour default (owner,
          # 18 November 2026; never lower). The hold covers the hours before a new
          # malicious release reaches Aikido's malware feed. $GITHUB_ENV carries it to
          # the job's later steps, where the installs run (a step's own env: would
          # not), and it outranks the hours a repository's .aikido sets.
          echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS=24" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
