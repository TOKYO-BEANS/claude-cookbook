name: Depot CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Diff-aware scans on pull requests fetch the base branch with this
          # read-only token (permissions: contents: read).
          persist-credentials: true
          fetch-depth: 0
      # Version and wheel hashes live in .depot/semgrep-requirements.txt; pip installs
      # only those wheels and refuses any file whose hash does not match.
      - name: Install Semgrep
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --require-hashes --no-deps --only-binary :all: -r .depot/semgrep-requirements.txt
          # The lock overrides Semgrep's mcp and OpenTelemetry pins (GHSA-84m7-p3x7-pcfv,
          # GHSA-xcq7-p3pf-p88h; see the lock's header): pip check may report exactly these
          # four conflicts, in any order, and nothing else.
          accepted=(
            "semgrep 1.182.0 has requirement mcp==1.29.0, but you have mcp 1.30.0."
            "semgrep 1.182.0 has requirement opentelemetry-api~=1.37.0, but you have opentelemetry-api 1.45.1."
            "semgrep 1.182.0 has requirement opentelemetry-exporter-otlp-proto-http~=1.37.0, but you have opentelemetry-exporter-otlp-proto-http 1.45.1."
            "semgrep 1.182.0 has requirement opentelemetry-sdk~=1.37.0, but you have opentelemetry-sdk 1.45.1."
          )
          broken="$("$RUNNER_TEMP/semgrep/bin/python" -m pip check)" || [ "$(sort <<<"$broken")" = "$(printf '%s\n' "${accepted[@]}" | sort)" ] || { echo "$broken"; exit 1; }
          echo "pip check: $broken"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: Semgrep (Supply Chain)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "::error::Depot CI secret SEMGREP_APP_TOKEN is not set"
            exit 1
          fi
          semgrep ci --supply-chain --no-suppress-errors --json-output="$RUNNER_TEMP/semgrep.json"
      # Our own gate, versioned here instead of in the Semgrep account policy: fail only
      # on a reachable vulnerable dependency of high or critical severity. A code
      # finding is CodeQL's to gate, and an unreachable one never fails the job.
      # Prints rule and location only, never code.
      - name: Gate on reachable vulnerable dependencies
        run: |
          python3 - "$RUNNER_TEMP/semgrep.json" <<'PY'
          import json, os, sys
          if not os.path.exists(sys.argv[1]):
              print("Semgrep gate: no results file - the scan did not complete")
              sys.exit(1)
          data = json.load(open(sys.argv[1]))
          high = {"ERROR", "HIGH", "CRITICAL"}
          blocking = []
          for r in data.get("results", []):
              extra = r.get("extra") or {}
              severity = str(extra.get("severity", "")).upper()
              sca = extra.get("sca_info")
              if sca is not None and bool(sca.get("reachable")) and severity in high:
                  blocking.append(f"{r.get('check_id')} {r.get('path')}:{(r.get('start') or {}).get('line')} [{severity}/reachable]")
          total = len(data.get("results", []))
          print(f"Semgrep gate: {total} findings, {len(blocking)} blocking (reachable high/critical dependency)")
          for b in blocking:
              print("  BLOCKING " + b)
          sys.exit(1 if blocking else 0)
          PY

  test:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install Aikido Safe Chain (malware check on npm and pip installs)
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          # Outside the checkout: the installer sources nvm, and nvm stops it (exit 3)
          # on a .nvmrc naming a Node version that nvm does not hold.
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - run: npm ci
      - run: npm test

  ai-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-24.04
    # Two API attempts of at most 12 minutes each, plus checkout and install.
    timeout-minutes: 30
    # Depot CI's GITHUB_TOKEN is a Depot Code Access app token; the app holds
    # pull_requests: write, so this job can post its one comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history: the base commit (for the reviewer and the rules) and
          # the merge base (for the diff) are both in the checkout.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Copy the reviewer from the base branch
        id: reviewer
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          reason=""
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            reason="the base commit id is missing"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            reason="the base commit is not in the checkout"
          else
            for f in review.mjs package.json package-lock.json; do
              git cat-file -e "${BASE_SHA}:.depot/ai-review/$f" 2>/dev/null || reason="no reviewer on the base branch"
            done
          fi
          if [ -n "$reason" ]; then
            echo "review unavailable: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ai-review"
          for f in review.mjs package.json package-lock.json; do
            git show "${BASE_SHA}:.depot/ai-review/$f" > "$RUNNER_TEMP/ai-review/$f"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Install Aikido Safe Chain (malware check on npm and pip installs)
        if: steps.reviewer.outputs.ready == 'true'
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          # Outside the checkout: the installer sources nvm, and nvm stops it (exit 3)
          # on a .nvmrc naming a Node version that nvm does not hold.
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - name: Install the reviewer's locked dependencies
        if: steps.reviewer.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ai-review"
          npm ci --ignore-scripts
      # node, never npx or npm exec: Safe Chain checks every npx call against the
      # registry (10 s limit, fails closed) even for an installed package. Runs
      # from the checkout's root, where review.mjs reads the diff with git.
      - name: AI review (advisory)
        if: steps.reviewer.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY_REVIEW: ${{ secrets.ANTHROPIC_API_KEY_REVIEW }}
          ANTHROPIC_WORKSPACE_ID_REVIEW: ${{ vars.ANTHROPIC_WORKSPACE_ID_REVIEW }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed through env, never interpolated into the script: the title and
          # body are the pull request author's text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node "$RUNNER_TEMP/ai-review/review.mjs"
