name: Depot CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Diff-aware scans on pull requests fetch the base branch with this
          # read-only token (permissions: contents: read).
          persist-credentials: true
          fetch-depth: 0
      # Version and wheel hashes live in .depot/semgrep-requirements.txt; pip installs
      # only those wheels and refuses any file whose hash does not match.
      - name: Install Semgrep
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --require-hashes --no-deps --only-binary :all: -r .depot/semgrep-requirements.txt
          # The lock overrides Semgrep's mcp and OpenTelemetry pins (GHSA-84m7-p3x7-pcfv,
          # GHSA-xcq7-p3pf-p88h; see the lock's header): pip check may report exactly these
          # four conflicts, in any order, and nothing else.
          accepted=(
            "semgrep 1.182.0 has requirement mcp==1.29.0, but you have mcp 1.30.0."
            "semgrep 1.182.0 has requirement opentelemetry-api~=1.37.0, but you have opentelemetry-api 1.45.1."
            "semgrep 1.182.0 has requirement opentelemetry-exporter-otlp-proto-http~=1.37.0, but you have opentelemetry-exporter-otlp-proto-http 1.45.1."
            "semgrep 1.182.0 has requirement opentelemetry-sdk~=1.37.0, but you have opentelemetry-sdk 1.45.1."
          )
          broken="$("$RUNNER_TEMP/semgrep/bin/python" -m pip check)" || [ "$(sort <<<"$broken")" = "$(printf '%s\n' "${accepted[@]}" | sort)" ] || { echo "$broken"; exit 1; }
          echo "pip check: $broken"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: Semgrep (Pro rules and Supply Chain)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "::error::Depot CI secret SEMGREP_APP_TOKEN is not set"
            exit 1
          fi
          semgrep ci --no-suppress-errors --json-output="$RUNNER_TEMP/semgrep.json"
      # Our own gate, versioned here instead of in the Semgrep account policy: fail on
      # high/critical code findings with at least medium confidence, and on reachable
      # vulnerable dependencies. Prints rule and location only, never code.
      - name: Gate on high-severity findings
        run: |
          python3 - "$RUNNER_TEMP/semgrep.json" <<'PY'
          import json, os, sys
          if not os.path.exists(sys.argv[1]):
              print("Semgrep gate: no results file - the scan did not complete")
              sys.exit(1)
          data = json.load(open(sys.argv[1]))
          high = {"ERROR", "HIGH", "CRITICAL"}
          blocking = []
          for r in data.get("results", []):
              extra = r.get("extra") or {}
              severity = str(extra.get("severity", "")).upper()
              confidence = str((extra.get("metadata") or {}).get("confidence", "HIGH")).upper()
              sca = extra.get("sca_info")
              if sca is not None:
                  hit = bool(sca.get("reachable")) and severity in high
              else:
                  hit = severity in high and confidence != "LOW"
              if hit:
                  blocking.append(f"{r.get('check_id')} {r.get('path')}:{(r.get('start') or {}).get('line')} [{severity}/{confidence}]")
          total = len(data.get("results", []))
          print(f"Semgrep gate: {total} findings, {len(blocking)} blocking (high/critical, or reachable dependency)")
          for b in blocking:
              print("  BLOCKING " + b)
          sys.exit(1 if blocking else 0)
          PY

  test:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install Aikido Safe Chain (malware check on npm and pip installs)
        retry:
          retries: 3
          backoff: exponential
          delay-seconds: 10
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          # Outside the checkout: the installer sources nvm, and nvm stops it (exit 3)
          # on a .nvmrc naming a Node version that nvm does not hold.
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - run: npm ci
      - run: npm test
